<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    .box { fill:#f3f4f6; stroke:#111827; stroke-width:1; rx:6; }
    .direct { fill:#d1fae5; stroke:#059669; }
    .indirect { fill:#fff7ed; stroke:#ea580c; }
    .platform { fill:#eff6ff; stroke:#2563eb; }
    .unalloc { fill:#ffeeee; stroke:#b91c1c; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#0f172a }
    .small { font-size:11px; fill:#374151 }
    .arrow { stroke:#4b5563; stroke-width:2; fill:none; marker-end:url(#arrowhead)}
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Source and classification -->
  <rect x="40" y="20" width="220" height="56" class="box"/>
  <text x="150" y="55" text-anchor="middle" class="label">Azure cost rows</text>

  <rect x="300" y="20" width="220" height="56" class="box"/>
  <text x="410" y="55" text-anchor="middle" class="label">Classification</text>

  <path d="M260 48 L300 48" class="arrow" />

  <!-- Category boxes -->
  <rect x="40" y="110" width="180" height="64" class="direct box"/>
  <text x="130" y="138" text-anchor="middle" class="label">Direct costs</text>
  <text x="130" y="156" text-anchor="middle" class="small">Map to agent via tags</text>

  <rect x="250" y="110" width="180" height="64" class="indirect box"/>
  <text x="340" y="138" text-anchor="middle" class="label">Indirect costs</text>
  <text x="340" y="156" text-anchor="middle" class="small">Choose distribution key</text>

  <rect x="460" y="110" width="180" height="64" class="platform box"/>
  <text x="550" y="138" text-anchor="middle" class="label">Platform costs</text>
  <text x="550" y="156" text-anchor="middle" class="small">Weighted usage → score</text>

  <rect x="670" y="110" width="180" height="64" class="unalloc box"/>
  <text x="760" y="138" text-anchor="middle" class="label">Unallocated costs</text>
  <text x="760" y="156" text-anchor="middle" class="small">Governance / review</text>

  <!-- Arrows from classification to categories -->
  <path d="M420 76 L130 110" class="arrow" />
  <path d="M420 76 L360 110" class="arrow" />
  <path d="M420 76 L570 110" class="arrow" />
  <path d="M420 76 L760 110" class="arrow" />

  <!-- Ledger -->
  <rect x="310" y="230" width="280" height="56" class="box"/>
  <text x="450" y="265" text-anchor="middle" class="label">Cost ledger</text>

  <!-- Arrows to ledger -->
  <path d="M130 174 L360 230" class="arrow" />
  <path d="M340 174 L420 230" class="arrow" />
  <path d="M550 174 L470 230" class="arrow" />
  <path d="M760 174 L610 230" class="arrow" />

</svg>
